# keyd (/etc/keyd/default.conf, plugin keyd: install-keyd.sh): Mac-style text keys as real key presses, before Hyprland.
# Hyprland's send_shortcut sometimes loses a synthetic key's release and the app keeps repeating the key (Hyprland
# #8385, #6407); keyd sends ordinary presses and releases. ⌘⌫ is per app: app.conf (keyd-application-mapper).
# Emergency exit: Backspace + Escape + Enter together stops keyd.

[ids]
*

[main]
# Fn: keyd's virtual keyboard can't send KEY_FN, so Fn would vanish (dictation is Fn held, bindings.lua). F19 stands in
# for it. Fn's combos (Fn+arrows, Fn+⌫ …) are made by the kernel (hid_apple) before keyd and still work.
fn = f19

[alt]
# ⌥⌫: delete the previous word (GTK, Chromium, Firefox, Qt: Ctrl+Backspace; kitty: kitty.conf maps it to ^W)
backspace = C-backspace
