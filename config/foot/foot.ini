# foot – the same look and Mac-style keys (⌘ = Mod4) as kitty (kitty/kitty.conf). Install it from the launcher:
# System › Install › Software › Terminals. foot has no tabs: ⌘⌥← / ⌘⌥→ do nothing here.

[main]
# --- Font ---
# Light, not kitty's Thin: foot draws the thin face thinner and dimmer, as Alacritty does
font=JetBrains Mono:style=Light:size=9.5
font-bold=JetBrains Mono:style=SemiBold:size=9.5
# --- Appearance ---
pad=10x10
# Selected text is copied to the clipboard immediately (as in kitty). In programs that grab the mouse (e.g. Claude
# Code, tmux, vim), select while holding Shift.
selection-target=clipboard

[cursor]
style=block
blink=no

# --- Tokyo Night (Omarchy's default theme), as in kitty ---
[colors-dark]
alpha=0.97
background=171822
foreground=c0caf5
selection-background=33467c
selection-foreground=c0caf5
cursor=171822 c0caf5
urls=73daca
regular0=15161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6
bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=c0caf5

[key-bindings]
# --- Clipboard: ⌘C / ⌘V (Ctrl+Shift+C/V works too); Hyprland sends them as Ctrl+Insert / Shift+Insert ---
clipboard-copy=Mod4+c Control+Shift+c Control+Insert XF86Copy
clipboard-paste=Mod4+v Control+Shift+v Shift+Insert XF86Paste
# Shift+Insert pastes the clipboard above, not the selection
primary-paste=none
# --- Other Mac habits ---
spawn-terminal=Mod4+n Control+Shift+n
font-increase=Mod4+plus Mod4+equal Control+plus Control+equal Control+KP_Add
font-decrease=Mod4+minus Control+minus Control+KP_Subtract
font-reset=Mod4+0 Control+0 Control+KP_0
# Links: foot opens them from the keyboard (letters on each link), not by clicking
show-urls-launch=Control+Shift+o

[text-bindings]
# ⌘K clears the screen (^L)
\x0c=Mod4+k
# Option+arrows jump over a word like in iTerm
\x1bb=Mod1+Left
\x1bf=Mod1+Right
# Ctrl+⌫ deletes the previous word like in other apps (^W); also what ⌥⌫ arrives as when keyd remaps it
\x17=Control+BackSpace

# The look (`nightdrive theme set background …`, hypr/scripts/theme): background and opacity; the values above are its
# defaults. The theme writes it when the session starts, before any terminal.
[main]
include=~/.cache/nightdrive/foot.ini

# Your own settings last, so they win: local.ini next to this file (git-ignored; link.sh makes an empty one, as foot
# stops at an include that isn't there)
[main]
include=~/.config/foot/local.ini
