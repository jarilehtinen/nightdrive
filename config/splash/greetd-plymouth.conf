# Plymouth's splash stays on screen until the login screen draws, instead of a black screen in between (as GDM does it).
# Installed as /etc/systemd/system/greetd.service.d/nightdrive-splash.conf by config/splash/install.sh.
[Unit]
Conflicts=plymouth-quit.service
OnFailure=plymouth-quit.service

[Service]
# The text console (tty1, with the boot's kernel lines) shows whenever no one draws: when Plymouth lets go below and
# when the login screen's Hyprland exits before the desktop's starts. Cleared, without a cursor, and its background
# (palette colour 0) set to the login screen's bg: those gaps then look like the same dark screen.
ExecStartPre=-/bin/sh -c "printf '\\033]P01a1b26\\033[2J\\033[H\\033[?25l' > /dev/tty1"
# deactivate: Plymouth lets go of the screen so the greeter's Hyprland can take it; the last frame stays shown
ExecStartPre=-/usr/bin/plymouth deactivate
ExecStartPost=-/usr/bin/plymouth quit --retain-splash
