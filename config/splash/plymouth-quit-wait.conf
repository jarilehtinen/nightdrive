# greetd starts after plymouth-quit-wait, which holds until Plymouth has quit, and with greetd-plymouth.conf it's greetd
# that quits Plymouth (once the login screen can take the screen): without this the boot would wait forever on the splash.
# Installed as /etc/systemd/system/plymouth-quit-wait.service.d/nightdrive-splash.conf by install.sh, with that one.
[Service]
ExecStart=
ExecStart=/usr/bin/true
