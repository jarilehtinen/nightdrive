# Top bar sizes. The bar reloads this on save; `nightdrive topbar adjust` changes it live.
#   text      every text in the bar's modules (one font, one size)
#   workspaces  the workspace numbers
#   icon      icons without their own row
#   notch     size = the MacBook notch's width (modules don't go under it; 0 = no notch). Without the row: found from
#             the internal screen's resolution (show_notch=1)
#   <module>  that module's icon (the names in modules.jsonc); a private overlay adds rows in local.adjust.conf
# size  px: an icon's box (its SVG viewBox is scaled to size × size) or the text's font size
# Icons are centred in the bar by their box, text by its digits. Halves are real pixels on a 2× screen.
#
# element         size
text              12.5
workspaces        12.5
icon              16
claude            18
system            16
bluetooth         16
wifi              17
volume            17
headphones        15
display           16
battery           17
notifications     15
