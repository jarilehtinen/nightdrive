# Top bar sizes and vertical positions. The bar reloads this on save; `nightdrive topbar adjust` changes it live.
#   text      every text in the bar's modules (one font, one size)
#   workspaces  the workspace numbers
#   icon      icons without their own row
#   <module>  that module's icon (the names in modules.jsonc); a private overlay adds rows in local.adjust.conf
# size  px: an icon's box (its SVG viewBox is scaled to size × size) or the text's font size
# y     px, + = lower. 0 = centred in the bar (an icon by its box, text by its digits). Halves are real pixels on a 2× screen.
#
# element         size   y
text              12.5   0
workspaces        12.5   0
icon              16     0
deck              16     0
claude            18     0
system            16     0
tailscale         18     0
bluetooth         16     0
wifi              17     0
volume            17     0
headphones        15     0
display           16     0
battery           17     0
notifications     15     0
