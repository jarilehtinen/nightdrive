[main]
font=JetBrains Mono:size=14
terminal=kitty
icon-theme=Papirus-Dark
prompt=""
width=44
lines=10
horizontal-pad=24
vertical-pad=18
inner-pad=14
line-height=34
layer=overlay
# Theme colour (Settings › Theme › Color): hypr/scripts/theme writes the [colors] values (text, selection, matches, border)
include=~/.cache/nightdrive/fuzzel.ini

[colors]
background=1a1b26f7

[border]
width=2
radius=4
selection-radius=6
