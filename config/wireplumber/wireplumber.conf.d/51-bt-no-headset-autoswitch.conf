# Bluetooth headphones stay in music mode (A2DP): their mic never becomes the default mic and recording doesn't switch
# them to headset mode (HFP). Otherwise dictation (F5) got quiet audio and started slowly, and music quality dropped.
# The headphone mic can still be used when needed by picking the HSP/HFP profile in pavucontrol.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
