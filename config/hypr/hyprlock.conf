$font = JetBrains Mono
# Theme colour (Settings › Theme › Color): hypr/scripts/theme writes $primary and $accent
$primary = rgb(c071eb)
$accent = rgb(e0bff2)
source = ~/.cache/nightdrive/hyprlock.conf

general {
    hide_cursor = true
}

# The login screen's background (greeter/background.sh: the wallpaper, darkened in the middle), not a screenshot: a
# blurred screenshot still shows what was on the screen (windows, a password manager)
background {
    monitor =
    path = ~/.config/greeter/background.jpg
    color = rgb(11,11,13)
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(0b0b0dcc)
    outer_color = $primary
    check_color = rgb(9ece6a)
    fail_color = rgb(f7768e)
    font_color = $accent
    fade_on_empty = false
    rounding = 4
    font_family = $font
    placeholder_text = Password…
    fail_text = $PAMFAIL
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = $accent
    position = 0, 160
    halign = center
    valign = center
}
