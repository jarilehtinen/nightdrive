# Template: hypr/scripts/idle sets the screensaver's and the screen-off listener's times from the launcher
# (Settings › Screensaver; defaults 10 and 30 min) and runs hypridle with the result (~/.cache/nightdrive/hypridle.conf)
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Screensaver (Nightdrive, synthwave ASCII). It closes itself on a key press or mouse movement: no on-resume here,
# because opening its window counts as activity and on-resume would close it right away.
listener {
    timeout = 600
    on-timeout = ~/.config/screensaver/start
}

listener {
    timeout = 1800
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1830
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
