# Template: hypr/scripts/idle sets the screensaver's and the screen-off listener's times from the launcher
# (Settings › Screensaver; defaults 10 and 30 min) and runs hypridle with the result (~/.cache/nightdrive/hypridle.conf)
general {
    lock_cmd = ~/.config/hypr/scripts/lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# In use or idle, for logind (IdleHint): what GNOME and KDE tell it too. Ferry reads it to send from the phone to the
# computer in use. A minute without input counts as idle.
listener {
    timeout = 60
    on-timeout = busctl call org.freedesktop.login1 /org/freedesktop/login1/session/auto org.freedesktop.login1.Session SetIdleHint b true
    on-resume = busctl call org.freedesktop.login1 /org/freedesktop/login1/session/auto org.freedesktop.login1.Session SetIdleHint b false
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Screensaver (Nightdrive, synthwave ASCII). It closes itself on a key press or mouse movement: no on-resume here,
# because opening its window counts as activity and on-resume would close it right away.
listener {
    timeout = 600
    on-timeout = ~/.config/screensaver/start
}

listener {
    timeout = 1800
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1830
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
