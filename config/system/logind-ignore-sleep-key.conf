# F6 (Apple keyboard) sends KEY_SLEEP, which logind treats as the suspend key (-> lock/sleep).
# Hyprland uses the key as the do-not-disturb toggle (config/hypr/bindings.lua), so logind ignores it.
# Install (from the repo root):  sudo install -Dm644 config/system/logind-ignore-sleep-key.conf /etc/systemd/logind.conf.d/50-ignore-sleep-key.conf && sudo systemctl kill -s HUP systemd-logind
[Login]
HandleSuspendKey=ignore
