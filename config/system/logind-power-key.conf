# The power button (Touch ID key on Apple Silicon Macs) powers off at once by default. logind ignores it and Hyprland
# opens the power dialog instead (config/hypr/bindings.lua, quickshell/PowerDialog.qml): Lock, Sleep, Log out, Restart, Shut down.
# Holding the key for ~10 s still forces the machine off (firmware), so a hung session can always be turned off.
# Install (from the repo root):  sudo install -Dm644 config/system/logind-power-key.conf /etc/systemd/logind.conf.d/50-power-key.conf && sudo systemctl kill -s HUP systemd-logind
[Login]
HandlePowerKey=ignore
