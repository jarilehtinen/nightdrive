name: Bug report
description: Something in Nightdrive is broken or behaves oddly (for a failed ./install.sh, use Install problem)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! A few details about your machine help a lot,
        since Nightdrive has only been tested on a handful of machines so far. The
        [known issues](https://github.com/nightdrive-sh/nightdrive/issues?q=is%3Aissue%20label%3A%22known%20issue%22)
        may already have it, with a workaround: a comment there counts as a second report.
  - type: dropdown
    id: machine
    attributes:
      label: Machine type
      description: What `nightdrive platform machine` prints.
      options:
        - asahi (Apple Silicon Mac, Fedora Asahi Remix)
        - pc (x86_64, Fedora KDE)
        - vm (virtual machine)
        - Other (something else, or the command fails: describe it under Machine)
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Machine
      description: The model, and on a PC the graphics card. In a VM, the host and the hypervisor.
      placeholder: MacBook Air 13″ M2 · ThinkPad T14 Gen 4, Intel graphics · Parallels 27 on a Mac mini M4
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: |
        Run these and paste the output. `~/dotfiles` is where the README clones Nightdrive; use your own path if it's elsewhere.
        ```
        git -C ~/dotfiles rev-parse --short HEAD
        cat /etc/fedora-release
        nightdrive platform; nightdrive platform machine; nightdrive platform gpu
        hyprctl version | head -1
        ```
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Screenshots are welcome.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press ⌘Space
        2. …
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Whatever looks relevant. The usual places:
        ```
        hyprctl configerrors        # Hyprland's config
        qs log | tail -50           # the top bar, menus and launcher (Quickshell)
        journalctl --user -b | tail -100
        ```
      render: text
