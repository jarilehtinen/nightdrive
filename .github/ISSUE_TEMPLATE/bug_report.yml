name: Bug report
description: Something in Nightdrive is broken or behaves oddly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! A few details about your machine help a lot,
        since Nightdrive has only been tested on a handful of Macs so far.
  - type: input
    id: mac
    attributes:
      label: Mac model
      placeholder: MacBook Air 13″, M2, 2022
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: |
        Run these and paste the output. `~/dotfiles` is where the README clones Nightdrive; use your own path if it's elsewhere.
        ```
        git -C ~/dotfiles rev-parse --short HEAD
        cat /etc/fedora-release
        hyprctl version | head -1
        ```
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Screenshots are welcome.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press ⌘Space
        2. …
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Anything relevant from `journalctl --user -b` or the terminal.
      render: text
