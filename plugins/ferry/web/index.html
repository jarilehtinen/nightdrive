<!doctype html>
<!-- Ferry's page for the phone (served by bin/ferry, which fills in %BASE%: the path tailscale serve mounts it at).
     Everything is relative to it, so the page works under any mount point. -->
<html lang="en">
<head>
<meta charset="utf-8">
<base href="%BASE%">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ferry">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Ferry</title>
<style>
  /* Nightdrive's menu colours (quickshell/Theme.qml, the violet theme) */
  /* Nightdrive's font, from the computer (bin/ferry serves the system's JetBrains Mono); the system's otherwise */
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; font-display: swap; src: url("font/JetBrainsMono-Regular.otf"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 500 600; font-display: swap; src: url("font/JetBrainsMono-Medium.otf"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; font-display: swap; src: url("font/JetBrainsMono-Bold.otf"); }
  :root {
    --bg: #0b0b0d; --card: #16121b; --hover: #1f1528; --sel: #35253d; --border: #3a2f45;
    --text: #c9bdd3; --dim: #9486a3; --accent: #e0bff2; --primary: #c071eb;
    --danger: #f7768e; --ok: #9ece6a; --warning: #ff9e64;
    --dock: 185px;             /* room under the list for the bar at the bottom (and its pill) */
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  /* As in Ferry's iPhone app: a large title, Received on one card, and the ways to send in a bar at the bottom */
  body {
    font: 15px/1.45 "JetBrains Mono", ui-monospace, Menlo, monospace;
    padding: calc(env(safe-area-inset-top) + 18px) calc(env(safe-area-inset-right) + 16px)
             calc(env(safe-area-inset-bottom) + var(--dock)) calc(env(safe-area-inset-left) + 16px);
    max-width: 640px; margin: 0 auto;
  }
  body:has(#compose:not([hidden])) { --dock: 295px; }
  header { display: flex; align-items: center; gap: 12px; margin: 0 0 22px; }
  /* The app icon's own shape: a rounded square (iOS's 22.5 %) */
  header img { width: 44px; height: 44px; border-radius: 22.5%; box-shadow: 0 0 0 1px rgba(255, 255, 255, .06); }
  h1 { font: 700 34px/1 -apple-system, system-ui, sans-serif; margin: 0; color: var(--accent); letter-spacing: -.01em; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--dim); margin-left: auto; min-width: 0; }
  #statusText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .status.ok .dot { background: var(--ok); }
  .status.bad .dot { background: var(--danger); }
  .status.wait .dot { animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .spin .i { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .banner { background: #2a1520; color: var(--text); border-radius: 14px; padding: 12px 14px; margin: 0 0 14px; font-size: 14px; }
  .banner b { color: var(--danger); }
  .banner.info { background: var(--card); }
  .banner.info b { color: var(--accent); }
  .banner button { margin-top: 10px; }
  /* Turn on notifications alone: the button by itself, in the middle, no box around it */
  .banner.bare { background: none; padding: 0; display: flex; justify-content: center; }
  .banner.bare button { margin-top: 0; }
  section { margin: 0 0 18px; }
  h2 { font-size: 13px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: var(--primary);
       margin: 0 6px 10px 10px; display: flex; justify-content: space-between; align-items: baseline; }
  /* Clear: quiet beside the title; the first tap asks */
  h2 button.clear { background: transparent; color: var(--dim); min-height: 0; padding: 2px 0; font-size: 15px; font-weight: 400;
                    letter-spacing: 0; text-transform: none; }
  h2 button.clear.armed { color: var(--danger); }
  button, .btn { appearance: none; border: 0; border-radius: 12px; padding: 0 18px; min-height: 50px; font: inherit;
                 font-size: 16px; font-weight: 500; background: var(--sel); color: var(--accent); cursor: pointer;
                 text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round;
        stroke-linejoin: round; }   /* <use> inherits from here, not from the sprite */
  button.primary, .btn.primary { background: var(--primary); color: #12081a; font-weight: 600; }
  button:active, .btn:active { opacity: .7; }
  button:disabled { opacity: .45; }
  [hidden] { display: none !important; }   /* buttons are inline-flex, which would win over hidden */
  button.small, .btn.small { min-height: 44px; padding: 0 16px; font-size: 16px; }
  input[type=file] { display: none; }

  /* Received: one card, a divider between the rows from the text on (not under the icon) */
  .list { background: var(--card); border-radius: 18px; overflow: hidden; }
  .swipe { position: relative; overflow: hidden; background: #3a1a26; }
  .swipe + .swipe::before { content: ""; position: absolute; top: 0; left: 84px; right: 18px; height: 1px;
                            background: rgba(58, 47, 69, .7); z-index: 1; }
  .swipe .bin { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; padding: 0 22px;
                color: var(--danger); opacity: 0; transition: opacity .15s; }
  .swipe .bin.l { left: 0; } .swipe .bin.r { right: 0; }
  .swipe.left .bin.r, .swipe.right .bin.l { opacity: .5; }
  .swipe.armed.left .bin.r, .swipe.armed.right .bin.l { opacity: 1; }
  .item { position: relative; display: flex; align-items: center; gap: 14px; padding: 12px 14px 12px 16px;
          background: var(--card); touch-action: pan-y; cursor: pointer; }
  .item.new { background: var(--hover); }   /* not seen yet */
  .item .lead { width: 54px; height: 54px; border-radius: 14px; background: var(--sel); color: var(--accent); flex: none;
                display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .item .lead img { width: 100%; height: 100%; object-fit: cover; }
  .item .lead .i { width: 26px; height: 26px; stroke-width: 1.75; }
  .item .body { flex: 1; min-width: 0; }
  .item .title { font-size: 15px; color: var(--accent); letter-spacing: .04em; overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; }
  .item .meta { font-size: 13px; color: var(--dim); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .act { width: 46px; height: 46px; min-height: 0; padding: 0; border-radius: 50%; flex: none; }
  .item .act .i { width: 22px; height: 22px; }
  .empty { color: var(--dim); font-size: 14px; padding: 18px 20px; }
  .offline .live, .offline #dock { opacity: .45; pointer-events: none; }

  /* The bar at the bottom: Aa, Send Clipboard and + under the computer it sends to. The list scrolls under it: the rows
     fade out to black above the pill (a long fade, so they don't mix with it), and the buttons sit on black. */
  #dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; pointer-events: none;
          padding: 89px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 14px)
                   calc(env(safe-area-inset-left) + 16px);
          background: linear-gradient(to bottom, rgba(11, 11, 13, 0), rgba(11, 11, 13, .35) 30px, rgba(11, 11, 13, .75) 63px, var(--bg) 86px); }
  #dock > * { pointer-events: auto; max-width: 608px; margin-left: auto; margin-right: auto; }
  /* Typing: the keyboard covers the home indicator, so its space would only be a gap above the keyboard */
  body:has(#text:focus) #dock { padding-bottom: 12px; }
  .noteline { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 8px; }
  .noteline:not(:has(.note:not(:empty))):not(:has(.progress[style*="block"])) { display: none; }
  .note { font-size: 13px; color: var(--dim); text-align: center; overflow-wrap: anywhere; }
  .note.err { color: var(--danger); }
  .progress { width: 60%; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; display: none; }
  .progress div { height: 100%; width: 0; background: var(--primary); transition: width .2s; }
  #compose { margin-bottom: 10px; }
  /* The page's own black, not the list's card colour: the box stands out from the rows behind it */
  textarea { width: 100%; min-height: 96px; max-height: 30vh; resize: none; display: block; background: var(--bg); color: var(--text);
             border: 1px solid var(--border); border-radius: 20px; padding: 14px 16px; font: inherit; font-size: 16px; }   /* 16 px: iOS doesn't zoom */
  textarea:focus { outline: none; border-color: var(--primary); }
  /* The computer it sends to; with several, a tap opens the system's own picker over it (framed until that send) */
  .to { position: relative; display: flex; width: max-content; align-items: center; gap: 9px; margin-bottom: 12px !important;
        padding: 8px 16px; border-radius: 999px; background: rgba(22, 18, 27, .92); border: 1px solid var(--border);
        font-size: 15px; color: var(--accent); }
  .to.manual { border-color: var(--primary); }
  .to .dot { background: var(--ok); }
  .to.away .dot { background: var(--danger); }
  .to .more { color: var(--dim); font-size: 12px; }
  .to select { position: absolute; inset: 0; width: 100%; opacity: 0; font-size: 16px; }   /* 16 px: iOS doesn't zoom */
  .bar { display: flex; align-items: center; gap: 10px; }
  .bar .round { width: 60px; height: 60px; min-height: 0; padding: 0; border-radius: 50%; flex: none;
                background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: 22px; font-weight: 400; }
  .bar .round.on { border-color: var(--primary); background: var(--sel); }
  .bar .round .i { width: 26px; height: 26px; }
  .bar .main { flex: 1; min-width: 0; height: 60px; padding: 0 14px; border-radius: 999px; font-size: 18px; font-weight: 600;
               font-family: -apple-system, system-ui, sans-serif; white-space: nowrap; overflow: hidden; }
  .bar .main .i { width: 24px; height: 24px; }
  @media (min-width: 700px) { .bar .round { width: 54px; height: 54px; } .bar .main { height: 54px; font-size: 17px; } }
</style>
</head>
<body>
<!-- Lucide icons (lucide.dev, ISC licence) used by the buttons: <svg class="i"><use href="#i-NAME"/></svg> -->
<svg width="0" height="0" style="position:absolute" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11zm7.318-19.539l-10.94 10.939"/></symbol>
  <symbol id="i-clipboard-paste" viewBox="0 0 24 24"><path d="M11 14h10M16 4h2a2 2 0 0 1 2 2v1.344M17 18l4-4l-4-4"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 1.793-1.113"/><rect width="8" height="4" x="8" y="2" rx="1"/></symbol>
  <symbol id="i-image-up" viewBox="0 0 24 24"><path d="M10.3 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10l-3.1-3.1a2 2 0 0 0-2.814.014L6 21"/><path d="m14 19.5l3-3l3 3M17 22v-5.5"/><circle cx="9" cy="9" r="2"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
  <symbol id="i-external-link" viewBox="0 0 24 24"><path d="M15 3h6v6m-11 5L21 3m-3 10v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 15V3m9 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10l5 5l5-5"/></symbol>
  <symbol id="i-trash-2" viewBox="0 0 24 24"><path d="M10 11v6m4-6v6m5-11v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M10.268 21a2 2 0 0 0 3.464 0m-10.47-5.674A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></symbol>

  <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></symbol>
  <symbol id="i-refresh-cw" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9a9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5m5 4a9 9 0 0 1-9 9a9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>

<header><img src="icon-180.png" alt=""><h1>Ferry</h1>
  <div class="status wait" id="status"><span class="dot"></span><span id="statusText"></span></div></header>
<div class="banner" id="offline" hidden></div>
<div class="banner info" id="pushHint" hidden></div>

<div class="live">
  <section id="received">
    <h2>Received <button class="clear" id="clearReceived" hidden>Clear</button></h2>
    <div id="toPhone" class="list"></div>
  </section>
</div>

<div id="dock">
  <div class="noteline"><div class="progress" id="progress"><div></div></div><span class="note" id="note"></span></div>
  <div class="to" id="to"><span class="dot"></span><span id="toName"></span><span class="more" id="toMore" hidden>▾</span>
    <select id="toPick" aria-label="Send to" hidden></select></div>
  <div id="compose" hidden>
    <textarea id="text" placeholder="Text or link" autocomplete="off" autocapitalize="off"></textarea>
  </div>
  <div class="bar">
    <button class="round" id="aa" aria-label="Write a text">Aa</button>
    <button class="primary main" id="main"><svg class="i"><use href="#i-clipboard-paste"/></svg>Send Clipboard</button>
    <label class="btn round" for="files" aria-label="Photos and files"><svg class="i"><use href="#i-plus"/></svg></label>
    <input type="file" id="files" multiple>
  </div>
</div>

<script>
"use strict"
const $ = id => document.getElementById(id)
const POLL = 5000              // ms between updates while the page is visible
const TIMEOUT = 8000           // ms before a computer counts as unreachable
const PREFETCH = 30e6          // bytes: files up to this size are fetched ahead, so Save can share them at once (iOS wants
                               // navigator.share() right in the tap, not after a download)
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true
const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)

// The owner's computers as one: this page's own one (HOME) finds the others running Ferry; Received lists what all
// of them hold, and Send goes to the one in use (target). Push subscriptions stay with HOME, which passes
// the others' notifications on.
const HOME = new URL(document.baseURI).href
let machines = JSON.parse(localStorage.getItem("ferry.machines") || "[]")   // [{ url, name, self }]
if (!machines.some(m => m.url === HOME))
  machines.unshift({ url: HOME, name: localStorage.getItem("ferry.computer") || "this computer", self: true })
let target = HOME
let manual = null              // a computer picked by hand: for the next send only
const state = {}               // url -> { ok: true | false | undefined, err, items }
let pushKey = null
let shown = "", shownAt = 0    // what was last drawn: a poll redraws only when something changed (or the ages did)
const blobs = new Map()        // item id -> File, fetched ahead
const seenIds = new Set(JSON.parse(localStorage.getItem("ferry.seen") || "[]"))

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag)
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v)
    else if (k in e) e[k] = v
    else e.setAttribute(k, v)
  }
  for (const k of kids) if (k != null) e.append(k)
  return e
}

// A Lucide icon from the sprite above
function icon(name) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg")
  s.setAttribute("class", "i")
  const u = document.createElementNS("http://www.w3.org/2000/svg", "use")
  u.setAttribute("href", "#i-" + name)
  s.append(u)
  return s
}
// A button's label is a text node after its icon: changed in place ("Copied") without losing the icon
function label(btn, text) { btn.lastChild.textContent = text }

// A call to the computer at m (its address)
async function api(m, path, opts = {}) {
  const ctl = new AbortController()
  const t = setTimeout(() => ctl.abort(), opts.timeout || TIMEOUT)
  try {
    const r = await fetch(m + path, { ...opts, signal: ctl.signal, cache: "no-store",
                                      headers: { "X-Ferry": "1", ...(opts.headers || {}) } })
    if (!r.ok) { const e = new Error(await r.text().catch(() => "") || r.statusText); e.status = r.status; throw e }
    return r
  } finally { clearTimeout(t) }
}
const nameOf = m => (machines.find(x => x.url === m) || {}).name || "the computer"
const many = () => machines.length > 1

function setStatus(kind, text) {
  $("status").className = "status " + kind
  $("statusText").textContent = text
}

// Every computer, in parallel; the page counts as offline only when none answers
async function refresh() {
  await Promise.all(machines.map(async m => {
    try {
      const j = await (await api(m.url, "api/items")).json()
      state[m.url] = { ok: true, idle: j.idle, items: (j.items || []).map(i => Object.assign(i, { m: m.url })) }
      if (j.computer && j.computer !== m.name) { m.name = j.computer; saveMachines() }
      if (m.self) pushKey = j.push || pushKey
    } catch (e) {
      state[m.url] = { ok: false, err: e, items: (state[m.url] || {}).items || [] }
    }
  }))
  const up = machines.filter(m => state[m.url].ok)
  if (!up.length) offline(state[HOME] ? state[HOME].err : null)
  else {
    document.body.classList.remove("offline")
    triedAt = ""
    $("offline").hidden = true
    setStatus("ok", many() ? `${up.length}/${machines.length} online` : nameOf(HOME))
  }
  drawTargets()
  const all = machines.flatMap(m => state[m.url] && state[m.url].ok ? state[m.url].items : [])
  const now = JSON.stringify(all)
  if (now !== shown || Date.now() - shownAt > 60000) { shown = now; shownAt = Date.now(); render(all) }
  pushState()
}

// Unreachable: say why it may be, and keep trying. The page itself comes from the service worker's cache then.
function offline(err) {
  document.body.classList.add("offline")
  const who = many() ? "your computers" : nameOf(HOME)
  let what, why
  if (err && err.status === 403) {
    what = "Not allowed"
    why = "Only for the computer's owner."
  } else if (err && err.status === 502) {
    what = "Ferry is off on " + who
    why = "Turn it on in the launcher: Install › Plugins."
  } else {
    what = "Can't reach " + who
    why = many() ? "They're asleep, or Tailscale is off." : "It's asleep, or Tailscale is off."
  }
  if (triedAt) why += " Tried at " + triedAt + "."
  setStatus(retrying ? "wait" : "bad", retrying ? "…" : what)
  const b = $("offline")
  b.replaceChildren(el("b", {}, what), el("div", {}, why),
                    el("button", { class: "small" + (retrying ? " spin" : ""), disabled: retrying, onclick: retry },
                       icon("refresh-cw"), retrying ? "Trying…" : "Try again"))
  b.hidden = false
}

// Try again shows that it's trying until the answer (or the timeout), and when it last tried: a failed retry redraws
// the same box, which would otherwise look like the tap did nothing
let retrying = false, triedAt = ""
async function retry() {
  retrying = true
  offline(state[HOME] ? state[HOME].err : null)
  await Promise.all([refresh(), new Promise(r => setTimeout(r, 600))])
  retrying = false
  triedAt = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })
  if (document.body.classList.contains("offline")) offline(state[HOME] ? state[HOME].err : null)
}

function ago(t) {
  const s = Date.now() / 1000 - t
  if (s < 60) return "now"
  if (s < 3600) return Math.floor(s / 60) + " min"
  if (s < 86400) return Math.floor(s / 3600) + " h"
  return Math.floor(s / 86400) + " d"
}
function size(n) {
  if (n < 1000) return n + " B"
  for (const u of ["KB", "MB", "GB"]) { n /= 1000; if (n < 1000 || u === "GB") return n.toFixed(1) + " " + u }
}
const isImage = it => /^image\/(jpeg|png|gif|webp|heic|heif|avif)/.test(it.type || "")

function note(text, err) {
  $("note").textContent = text || ""
  $("note").className = "note" + (err ? " err" : "")
}

async function copy(text, btn) {
  try {
    await navigator.clipboard.writeText(text)
  } catch (e) {
    // Older iOS or no permission: select a hidden field and copy that
    const t = el("textarea", { value: text, readOnly: true })
    t.style.position = "fixed"; t.style.opacity = "0"
    document.body.append(t); t.select(); t.setSelectionRange(0, text.length)
    const ok = document.execCommand("copy"); t.remove()
    if (!ok) { note("Can't copy", true); return }
  }
  checkOn(btn)
}
// A round button says it worked with a check for a moment, in its icon's place
function checkOn(btn) {
  const use = btn.querySelector("use")
  const icon0 = btn.dataset.icon || (btn.dataset.icon = use.getAttribute("href"))
  use.setAttribute("href", "#i-check")
  clearTimeout(btn.checkTimer)
  btn.checkTimer = setTimeout(() => use.setAttribute("href", icon0), 1500)
}

function prefetch(it) {
  if (blobs.has(it.id) || it.size > PREFETCH || !navigator.canShare) return
  blobs.set(it.id, null)
  api(it.m, "api/file/" + it.id, { timeout: 120000 }).then(r => r.blob())
    .then(b => blobs.set(it.id, new File([b], it.name, { type: it.type || b.type })))
    .catch(() => blobs.delete(it.id))
}

async function save(it, btn) {
  const f = blobs.get(it.id)
  if (f && navigator.canShare && navigator.canShare({ files: [f] })) {
    try { await navigator.share({ files: [f] }) } catch (e) { if (e.name !== "AbortError") note(e.message, true) }
    return
  }
  // Too big to fetch ahead, or no file sharing: the browser's own download
  location.href = it.m + "api/file/" + it.id + "?download=1"
}

async function removeItem(it) {
  try { await api(it.m, "api/remove?id=" + encodeURIComponent(it.id), { method: "POST" }); refresh() }
  catch (e) { note("Not removed", true); cards.delete(it.id); refresh() }   // its row is swiped shut: a new one
}

// Clear: the first tap asks ("Clear all?"), a second one within a few seconds empties the list on every computer
function clearButton(btn, to) {
  btn.onclick = async () => {
    if (!btn.classList.contains("armed")) {
      btn.classList.add("armed"); btn.textContent = "Clear all?"
      clearTimeout(btn.timer)
      btn.timer = setTimeout(() => { btn.classList.remove("armed"); btn.textContent = "Clear" }, 3000)
      return
    }
    clearTimeout(btn.timer)
    btn.classList.remove("armed"); btn.textContent = "Clear"
    await Promise.all(machines.filter(m => state[m.url] && state[m.url].ok)
      .map(m => api(m.url, "api/clear?to=" + to, { method: "POST" }).catch(() => note("Not all cleared", true))))
    refresh()
  }
}
clearButton($("clearReceived"), "phone")

// One row: the icon (a picture's own), the text or the file's name, its size, age and computer, and the round button
// for what a tap anywhere on the row does: copy a text, save a file (the share sheet: Save Image, Save to Files, …)
const metaOf = it => [it.kind === "file" ? size(it.size) : "", ago(it.time), nameOf(it.m)].filter(x => x).join(" · ")
function card(it) {
  const fresh = !seenIds.has(it.id)
  const meta = metaOf(it)
  let lead, title, act
  if (it.kind === "text") {
    lead = el("div", { class: "lead" }, icon("text"))
    title = it.text.replace(/\s+/g, " ").trim()
    act = el("button", { class: "act", "aria-label": "Copy" }, icon("copy"))
    act.onclick = e => { e.stopPropagation(); copy(it.text, act) }
  } else {
    lead = el("div", { class: "lead" }, isImage(it) && it.size < PREFETCH
      ? el("img", { src: it.m + "api/file/" + it.id, alt: "", loading: "lazy" }) : icon("file"))
    title = it.name
    prefetch(it)
    act = el("button", { class: "act", "aria-label": "Save" }, icon("download"))
    act.onclick = e => { e.stopPropagation(); save(it, act) }
  }
  const c = el("div", { class: "item" + (fresh ? " new" : ""), onclick: () => act.click() }, lead,
               el("div", { class: "body" }, el("div", { class: "title" }, title), el("div", { class: "meta" }, meta)), act)
  const wrap = el("div", { class: "swipe" }, el("div", { class: "bin l" }, icon("trash-2")),
                  el("div", { class: "bin r" }, icon("trash-2")), c)
  swipeable(wrap, c, () => removeItem(it))
  return wrap
}

// The rows already drawn, by item: a redraw keeps them (only the age and the highlight change), so a picture doesn't
// load again and the list doesn't blink
const cards = new Map()
function render(all) {
  const newest = (a, b) => b.time - a.time
  // Only what came to the phone: what it sent is the computers' to show, and needs no history here
  const toPhone = all.filter(i => i.to === "phone").sort(newest)
  const rows = toPhone.map(it => {
    let w = cards.get(it.id)
    if (!w) { w = card(it); cards.set(it.id, w); return w }
    w.querySelector(".meta").textContent = metaOf(it)
    w.querySelector(".item").classList.toggle("new", !seenIds.has(it.id))
    return w
  })
  for (const id of [...cards.keys()]) if (!toPhone.some(i => i.id === id)) cards.delete(id)
  $("toPhone").replaceChildren(...(rows.length ? rows : [el("div", { class: "empty" }, "Nothing yet")]))
  $("clearReceived").hidden = !toPhone.length
  // Marked as seen once shown: the highlight stays until the next update
  setTimeout(() => { for (const i of toPhone) seenIds.add(i.id); localStorage.setItem("ferry.seen", JSON.stringify([...seenIds].slice(-200))) }, 3000)
}

// Swiping a card left or right far enough removes it; a shorter swipe springs back, and a vertical one scrolls
const SWIPE = 0.35   // of the card's width
function swipeable(wrap, card, done) {
  let x0 = null, y0 = 0, dx = 0, dragging = false, swiped = false
  card.addEventListener("pointerdown", e => {
    if (e.button) return
    x0 = e.clientX; y0 = e.clientY; dx = 0; dragging = false
    card.style.transition = "none"
  })
  card.addEventListener("pointermove", e => {
    if (x0 === null) return
    const mx = e.clientX - x0, my = e.clientY - y0
    if (!dragging) {
      if (Math.abs(my) > 10 && Math.abs(my) > Math.abs(mx)) { x0 = null; return }   // a scroll
      if (Math.abs(mx) < 10) return
      dragging = true
      card.setPointerCapture(e.pointerId)
    }
    dx = mx
    card.style.transform = `translateX(${dx}px)`
    wrap.classList.toggle("left", dx < 0)
    wrap.classList.toggle("right", dx > 0)
    wrap.classList.toggle("armed", Math.abs(dx) > wrap.offsetWidth * SWIPE)
  })
  const end = () => {
    if (x0 === null) return
    x0 = null
    if (!dragging) return
    dragging = false
    swiped = true   // the click after it isn't a tap on a button
    setTimeout(() => swiped = false, 50)
    card.style.transition = "transform .2s ease-out"
    if (Math.abs(dx) <= wrap.offsetWidth * SWIPE) { card.style.transform = ""; wrap.classList.remove("armed", "left", "right"); return }
    card.style.transform = `translateX(${Math.sign(dx) * wrap.offsetWidth * 1.1}px)`
    // Then the gap closes
    wrap.style.height = wrap.offsetHeight + "px"
    setTimeout(() => {
      wrap.style.transition = "height .2s ease-out, margin .2s ease-out"
      wrap.style.height = "0"; wrap.style.marginBottom = "0"
    }, 150)
    setTimeout(done, 380)
  }
  card.addEventListener("pointerup", end)
  card.addEventListener("pointercancel", end)
  card.addEventListener("click", e => { if (swiped) { e.preventDefault(); e.stopPropagation() } }, true)
}

// --- Sending: to the computer in use (the one used last, by its logind), or one picked by hand for one send ---
const reachable = m => !(state[m.url] && state[m.url].ok === false)
const idleOf = m => state[m.url] && state[m.url].ok && typeof state[m.url].idle === "number" ? state[m.url].idle : Infinity
function used(m) {
  if (!reachable(m)) return "can't reach"
  const i = idleOf(m)
  return i === 0 ? "in use" : i === Infinity ? "" : "used " + ago(Date.now() / 1000 - i) + " ago"
}
function drawTargets() {
  $("toPick").hidden = $("toMore").hidden = !many()
  if (!many()) {
    manual = null; target = HOME
    $("to").className = "to" + (reachable({ url: HOME }) ? "" : " away")
    $("toName").textContent = nameOf(HOME)
    return
  }
  // Used last first; a computer that doesn't say (an older Ferry) after those that do, this page's own first among them
  const order = [...machines].sort((a, b) => (idleOf(a) - idleOf(b)) || (b.url === HOME) - (a.url === HOME))
  if (manual && !machines.some(m => m.url === manual && reachable(m))) manual = null
  target = manual || (order.find(reachable) || { url: HOME }).url
  $("to").className = "to" + (manual ? " manual" : "") + (reachable({ url: target }) ? "" : " away")
  $("toName").textContent = nameOf(target)
  if (document.activeElement !== $("toPick"))   // not under an open picker
    $("toPick").replaceChildren(...order.map(m => el("option", { value: m.url, selected: m.url === target,
      disabled: !reachable(m) }, m.name + (used(m) ? " · " + used(m) : ""))))
}
$("toPick").onchange = () => { manual = $("toPick").value; drawTargets() }
// Sent: the next send goes to the computer in use again
function sentTo() { manual = null; drawTargets() }
const away = () => state[target] && state[target].ok === false

// The big button sends the clipboard, or with Aa open the text typed above it
const writing = () => !$("compose").hidden
function drawMain() {
  if ($("main").sentTimer) return   // "Sent" for a moment
  $("main").querySelector("use").setAttribute("href", writing() ? "#i-send" : "#i-clipboard-paste")
  label($("main"), writing() ? "Send" : "Send Clipboard")
  $("main").disabled = writing() && !$("text").value.trim()
  $("aa").classList.toggle("on", writing())
}
function compose(open) {
  $("compose").hidden = !open
  if (open) $("text").focus()
  drawMain()
}
$("aa").onclick = () => compose(!writing())
$("text").addEventListener("input", drawMain)
$("text").addEventListener("keydown", e => { if (e.key === "Escape") compose(false) })
$("main").onclick = async () => {
  if (!writing()) return sendClipboard()
  if (!$("text").value.trim()) return
  if (await sendText($("text").value, $("main"))) { $("text").value = ""; compose(false) }
}

// Success shows in the big button: a check and "Sent" for a moment. The line above the pill is for progress and
// errors, and empties.
const SENT_SHOWN = 1500   // ms
function sentOn(btn) {
  note("")
  btn.disabled = false
  btn.querySelector("use").setAttribute("href", "#i-check"); label(btn, "Sent")
  clearTimeout(btn.sentTimer)
  btn.sentTimer = setTimeout(() => { btn.sentTimer = null; drawMain() }, SENT_SHOWN)
}

async function sendText(text, btn, clip = false) {
  if (away()) { note("Can't reach " + nameOf(target), true); return false }
  try {
    await api(target, "api/text", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text, clip }) })
    sentOn(btn)
    sentTo()
    refresh()
    return true
  } catch (e) { note("Not sent", true); return false }
}
// Reading the clipboard needs a tap: iOS shows a Paste button first. An image goes as a file, anything else as a text;
// one read() for both, as each read would ask again. Where it can't (permission, older browsers), Aa's text box takes a
// paste just as well.
const CLIP_IMAGE = { "image/png": "png", "image/jpeg": "jpg", "image/gif": "gif", "image/webp": "webp", "image/heic": "heic" }
async function sendClipboard() {
  let text = "", image = null, types = []
  try {
    if (navigator.clipboard.read) {
      for (const item of await navigator.clipboard.read()) {
        types.push(...item.types)
        const type = item.types.find(t => t in CLIP_IMAGE)
        if (type) { image = new File([await item.getType(type)], clipName(CLIP_IMAGE[type]), { type }); break }
        const tt = item.types.find(t => t === "text/plain" || t === "text/uri-list")
        if (tt && !text) text = await (await item.getType(tt)).text()
      }
    } else text = await navigator.clipboard.readText()
  } catch (e) {
    note("Paste into the box instead", true)
    compose(true)
    return
  }
  // clip: the computer puts it on its own clipboard too
  if (image) sendFiles([image], $("main"), true)
  else if (text.trim()) sendText(text, $("main"), true)
  // Something the page can't send: say what, rather than "empty". Safari gives a page a copied image only as PNG
  // (a screenshot): a photo from Photos (HEIC, JPEG) doesn't show at all, so "empty" points to +.
  else note(types.length ? "Can't send this from the clipboard (" + types.join(", ") + ")"
                         : "Clipboard is empty. A photo goes with +.", true)
}
// "Clipboard 2026-10-19 11.02.37.png": the clipboard gives an image no name of its own
function clipName(ext) {
  const d = new Date(), p = n => String(n).padStart(2, "0")
  return `Clipboard ${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}.${p(d.getMinutes())}.${p(d.getSeconds())}.${ext}`
}

$("files").onchange = () => {
  const files = [...$("files").files]
  $("files").value = ""
  if (files.length) sendFiles(files, $("main"))
}
async function sendFiles(files, btn, clip = false) {
  if (away()) { note("Can't reach " + nameOf(target), true); return }
  const to = target
  const bar = $("progress"), fill = bar.firstElementChild
  const total = files.reduce((n, f) => n + f.size, 0)
  let done = 0
  bar.style.display = "block"
  for (const [i, f] of files.entries()) {
    note(files.length > 1 ? `Sending ${i + 1}/${files.length}` : "Sending")
    try {
      await upload(to, f, clip, sent => fill.style.width = (100 * (done + sent) / Math.max(1, total)) + "%")
      done += f.size
    } catch (e) {
      bar.style.display = "none"
      note(`${f.name} not sent`, true)
      refresh()
      return
    }
  }
  bar.style.display = "none"; fill.style.width = "0"
  sentOn(btn)
  sentTo()
  refresh()
}

// XMLHttpRequest for the progress (fetch has no upload progress)
function upload(m, file, clip, progress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest()
    x.open("POST", m + "api/upload?" + new URLSearchParams({ name: file.name, type: file.type || "", ...(clip && { clip: "1" }) }))
    x.setRequestHeader("X-Ferry", "1")
    x.setRequestHeader("Content-Type", "application/octet-stream")
    x.upload.onprogress = e => progress(e.loaded)
    x.onload = () => x.status === 200 ? resolve() : reject(new Error(x.responseText || "error " + x.status))
    x.onerror = () => reject(new Error("can't reach " + nameOf(m)))
    x.send(file)
  })
}

// --- Notifications (Web Push; on iPhone only in the Home Screen app, iOS 16.4 and later) ---
function b64(s) {
  const raw = atob((s + "=".repeat((4 - s.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/"))
  return Uint8Array.from(raw, c => c.charCodeAt(0))
}
// What the box above the list says about notifications; drawn again only when that changes (every update asks)
function hint(what) {
  const box = $("pushHint")
  if (box.dataset.what === (what || "")) return
  box.dataset.what = what || ""
  box.hidden = !what
  box.classList.toggle("bare", what === "button")   // the button alone; a line of text keeps its box
  if (what === "home") box.replaceChildren("For notifications: Share › Add to Home Screen")
  else if (what === "denied") box.replaceChildren("Notifications are off in Settings")
  else if (what === "button")
    box.replaceChildren(el("button", { class: "primary small", onclick: enablePush }, icon("bell"), "Turn on notifications"))
}
async function pushState() {
  if (!("serviceWorker" in navigator)) return hint(null)
  if (ios && !standalone) return hint("home")
  if (!("PushManager" in window) || !pushKey) return hint(null)
  const reg = await navigator.serviceWorker.ready
  const sub = await reg.pushManager.getSubscription()
  if (sub && Notification.permission === "granted") {
    // Told again on every start: the computer may have lost it, or it may have changed
    if (!pushState.sent) { pushState.sent = true; api(HOME, "api/subscribe", { method: "POST", body: JSON.stringify(sub) }).catch(() => {}) }
    relayAll()
    return hint(null)
  }
  hint(Notification.permission === "denied" ? "denied" : "button")
}
async function enablePush() {
  try {
    // Asked right in the tap: iOS ignores a permission request that comes later
    const perm = await Notification.requestPermission()
    if (perm !== "granted") { pushState(); return }
    const reg = await navigator.serviceWorker.ready
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(pushKey) })
    await api(HOME, "api/subscribe", { method: "POST", body: JSON.stringify(sub) })
    pushState.sent = true
    relayAll()
    await api(HOME, "api/test-push", { method: "POST" })   // the first one says it works
  } catch (e) { note("Notifications failed", true) }
  pushState()
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {})
  navigator.serviceWorker.addEventListener("message", e => { if (e.data === "refresh") refresh() })
}

// --- Computers ---
function saveMachines() { localStorage.setItem("ferry.machines", JSON.stringify(machines)) }
async function loadMachines() {
  try {
    const j = await (await api(HOME, "api/machines", { timeout: 15000 })).json()
    if (!j.machines || !j.machines.length) return
    machines = j.machines
    if (j.push) pushKey = j.push
    saveMachines()
    relayAll()
    refresh()
  } catch (e) {}   // this page's computer is away: the list from last time
}
// The other computers send their notifications through this one, once notifications are on here
async function relayAll() {
  if (!pushState.sent || relayAll.done) return
  relayAll.done = true
  for (const m of machines.filter(m => !m.self))
    fetch(m.url + "api/relay", { method: "POST", headers: { "X-Ferry": "1", "Content-Type": "application/json" },
                                 body: JSON.stringify({ via: HOME }) }).catch(() => { relayAll.done = false })
}

let timer = null
function schedule() {
  clearInterval(timer)
  if (document.visibilityState === "visible") timer = setInterval(refresh, POLL)
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { refresh(); loadMachines() }
  schedule()
})
setStatus("wait", "…")
drawTargets()
drawMain()
refresh()
loadMachines()
schedule()
</script>
</body>
</html>
