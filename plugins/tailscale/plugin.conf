# Tailscale (README.md): its top bar icon and menu. The launcher's Settings › Tailscale stays in the core (Plugins.has).
name=Tailscale
icon=shield-check
description=VPN, in the top bar (log in from Settings › Tailscale)
default=on
install=sudo dnf install -y tailscale && sudo systemctl enable --now tailscaled && sudo tailscale set --operator=$USER
installed=command -v tailscale
group=recommended
version=1.0.2
author=@jarilehtinen
